<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1450" viewBox="0 0 1600 1450"><title>Katukina — paleta de cores e aplicações</title>
<rect x="0" y="0" width="1600" height="1450" fill="#FFFFFF"/>
