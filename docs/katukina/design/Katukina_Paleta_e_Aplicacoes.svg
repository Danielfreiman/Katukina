<text x="560" y="825" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#595957">e informações complementares.</text>
<rect x="1060" y="535" width="480" height="132" fill="#292C27"/>
<text x="1082" y="606" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#F7F7F2">#292C27</text>
<text x="1060" y="708" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#292C27">Carvão</text>
<text x="1060" y="739" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#595957">RGB 41 / 44 / 39</text>
