<rect x="90" y="1109" width="244" height="58" fill="#782E26"/>
<text x="116" y="1144" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#F7F7F2">Shop collection</text>
<rect x="355" y="1109" width="236" height="58" fill="#F7F7F2" stroke="#526B35"/>
<text x="380" y="1144" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#526B35">Our story</text>
<text x="90" y="1212" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#595957">Urucum: ação principal</text>
<text x="90" y="1241" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#595957">Verde: ação secundária e navegação ativa</text>
<text x="90" y="1294" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#595957">O fundo claro deve predominar na composição.</text>
<rect x="858" y="967" width="652" height="342" fill="#F7F7F2" stroke="#D3D4CF"/>
<text x="886" y="1002" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#292C27">EXEMPLO DE CARTÃO DE PRODUTO</text>
<text x="886" y="1057" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#292C27">Tribal Rapé</text>
<text x="886" y="1095" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#595957">Product details and origin</text>
<rect x="886" y="1122" width="596" height="1" fill="#D3D4CF"/>
<text x="886" y="1166" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#526B35">View product</text>
<text x="886" y="1227" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#595957">Carvão: títulos e leitura</text>
<text x="886" y="1257" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#595957">Cinza claro: contornos e divisórias</text>
<text x="60" y="1389" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#595957">Texto claro sobre urucum e verde folha · Evitar cinza claro em textos e ícones essenciais.</text>
<text x="60" y="1420" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#595957">Exemplos ilustrativos de aplicação cromática. Valores HEX e RGB como referência digital.</text>
